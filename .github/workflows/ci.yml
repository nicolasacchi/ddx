# Self-contained PR gate for this Go CLI. build/vet/gofmt/test block; lint is
# advisory until the repo's pre-existing findings are cleared (then drop
# continue-on-error).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: Test
        run: go test -race -count=1 ./...
      - name: Lint (advisory)
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
